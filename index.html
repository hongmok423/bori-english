<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="보리 영어">
</head>
<body>
<title>보리랑 영어 공책</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Gaegu:wght@700&family=Gowun+Dodum&display=swap">
<style>
/* Layout: one phone-width notebook column; every screen = one sheet of paper with one big next-step button. */
:root{
  --paper:#FBF7EF; --sheet:#FFFDF8; --ink:#2B2A33; --pencil:#6B6870; --line:#D9D2C3;
  --tomato:#E4572E; --sky:#3A86C8; --leaf:#4C9A5B; --sun:#F2B134; --peach:#F6D5C8;
  --tape:rgba(242,177,52,.35); --sky-soft:rgba(58,134,200,.12); --leaf-soft:rgba(76,154,91,.14);
  --f-en:"Andika","Comic Neue","Trebuchet MS",sans-serif;
  --f-ko:"Gowun Dodum","Apple SD Gothic Neo","Noto Sans KR",sans-serif;
  --f-hand:"Gaegu","Gowun Dodum","Apple SD Gothic Neo",sans-serif;
  color-scheme: light;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--f-ko);font-size:17px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 40px;
  -webkit-tap-highlight-color:transparent}
#app{max-width:520px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.en{font-family:var(--f-en)}
.hand{font-family:var(--f-hand);font-weight:700}
h1,h2,h3{margin:0;text-wrap:balance}
h1{font-family:var(--f-hand);font-size:32px;line-height:1.15}
h2{font-family:var(--f-hand);font-size:26px;line-height:1.2}
h3{font-size:17px}
p{margin:0}
.muted{color:var(--pencil)}
.small{font-size:14px}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--sky);outline-offset:2px}
.sheet{background:var(--sheet);border:1.5px solid var(--line);border-radius:6px;padding:18px;position:relative}
.sheet.tape::before{content:"";position:absolute;top:-10px;left:22px;width:64px;height:20px;background:var(--tape);transform:rotate(-4deg);border-radius:2px}
.tilt{transform:rotate(-1deg)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.col{display:flex;flex-direction:column;gap:12px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.btn{min-height:56px;padding:12px 20px;border-radius:14px;font-size:18px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:8px;border:2px solid var(--ink);background:var(--sheet);transition:transform .12s}
.btn:active{transform:translateY(2px)}
.btn.primary{background:var(--tomato);border-color:var(--tomato);color:#fff}
.btn.sound{background:var(--sky-soft);border-color:var(--sky);color:var(--ink)}
.btn.block{width:100%}
.btn[disabled]{opacity:.4;pointer-events:none}
.link{color:var(--pencil);text-decoration:underline;text-underline-offset:3px;font-size:15px;padding:8px}
.tile{min-height:52px;padding:10px 12px;border:1.5px solid var(--line);border-radius:10px;background:var(--sheet);text-align:left;display:flex;align-items:center;gap:10px}
.tile:active{background:var(--paper)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 8px;scrollbar-width:none}
.chip{flex:none;min-height:40px;padding:6px 14px;border-radius:999px;border:1.5px solid var(--line);background:var(--sheet);font-family:var(--f-en);font-size:16px}
.chip.on{border-color:var(--ink);background:var(--ink);color:var(--paper)}
/* header bar inside an activity */
.topbar{display:flex;align-items:center;gap:12px}
.close{width:44px;height:44px;border-radius:50%;border:1.5px solid var(--line);font-size:22px;line-height:1;flex:none}
.string{flex:1;height:22px;position:relative;display:flex;align-items:center;justify-content:space-between;min-width:0}
.string::before{content:"";position:absolute;left:0;right:0;top:50%;border-top:1.5px solid var(--pencil)}
.bead{position:relative;width:14px;height:14px;border-radius:50%;background:var(--paper);border:1.5px solid var(--pencil)}
.bead.on{background:var(--tomato);border-color:var(--tomato)}
/* word card */
.wordcard{padding:22px 18px 26px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:8px}
.pic{font-size:84px;line-height:1.1;height:96px;display:flex;align-items:center}
.word{font-family:var(--f-en);font-size:46px;font-weight:700;line-height:1.1;word-break:break-word}
.ko{font-size:19px;color:var(--pencil)}
.ex{font-family:var(--f-en);font-size:21px}
/* four-line notebook */
.lines4{position:relative;height:84px;margin:6px 0;background:
  linear-gradient(var(--line),var(--line)) 0 14px/100% 1.5px no-repeat,
  repeating-linear-gradient(90deg,var(--line) 0 6px,transparent 6px 11px) 0 34px/100% 1.5px no-repeat,
  linear-gradient(var(--tomato),var(--tomato)) 0 54px/100% 1.5px no-repeat,
  linear-gradient(var(--line),var(--line)) 0 74px/100% 1.5px no-repeat;display:flex;justify-content:center;gap:4px;align-items:flex-start}
.slot{width:34px;height:84px;font-family:var(--f-en);font-size:46px;line-height:1;padding-top:12px;text-align:center}
.slot.empty::after{content:"";display:block;width:24px;margin:44px auto 0;border-bottom:2px solid var(--pencil)}
.letters{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.letter{width:52px;height:56px;border-radius:10px;border:1.5px solid var(--ink);background:var(--sheet);font-family:var(--f-en);font-size:28px}
.letter.used{opacity:.25;pointer-events:none}
/* sentence tiles */
.built{min-height:64px;border-bottom:2px solid var(--line);display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:8px 0}
.wtile{min-height:48px;padding:6px 14px;border-radius:10px;border:1.5px solid var(--ink);background:var(--sheet);font-family:var(--f-en);font-size:22px}
.wtile.used{opacity:.25;pointer-events:none}
.slotword{display:inline-block;padding:0 8px;border-bottom:3px solid var(--tomato);color:var(--tomato)}
/* bubbles */
.scene{font-size:64px;text-align:center;padding:10px;border:1.5px dashed var(--line);border-radius:10px}
.bubble{max-width:86%;padding:10px 14px;border-radius:16px;border:1.5px solid var(--line);background:var(--sheet)}
.bubble .en{font-size:21px}
.bubble.me{align-self:flex-end;border-color:var(--sky);background:var(--sky-soft)}
.bubble.now{border-color:var(--tomato);border-width:2px}
.who{font-size:13px;color:var(--pencil)}
/* stamp feedback */
.stamp{position:fixed;left:50%;top:38%;width:150px;height:150px;margin:-75px 0 0 -75px;border-radius:50%;border:6px solid var(--leaf);color:var(--leaf);display:flex;align-items:center;justify-content:center;font-family:var(--f-hand);font-size:30px;transform:rotate(-12deg);background:rgba(255,253,248,.85);pointer-events:none;z-index:20;animation:stamp .18s ease-out}
.stamp.again{border-color:var(--tomato);color:var(--tomato);border-radius:18px;font-size:26px}
@keyframes stamp{from{transform:rotate(-12deg) scale(1.35);opacity:.3}to{transform:rotate(-12deg) scale(1);opacity:1}}
.opt-ok{border-color:var(--leaf)!important;background:var(--leaf-soft)!important}
.opt-no{border-color:var(--tomato)!important;background:var(--peach)!important}
/* stickers */
.stickers{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:12px}
.sticker{aspect-ratio:1;max-width:100%;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;border:2px dashed var(--line);color:var(--line);font-family:var(--f-en);font-size:13px;text-align:center;padding:6px}
.sticker .s-pic{font-size:30px;line-height:1.1}
.sticker.got{border:2px solid var(--ink);color:var(--ink);background:var(--sheet);transform:rotate(-3deg)}
.sticker.gold{border:3px solid var(--sun);box-shadow:0 0 0 4px rgba(242,177,52,.25)}
.week{display:flex;justify-content:space-between;gap:6px}
.day{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:13px;color:var(--pencil)}
.day .b{width:30px;height:30px;border-radius:50%;border:1.5px solid var(--pencil);background:var(--paper)}
.day .b.on{background:var(--tomato);border-color:var(--tomato)}
.day.today{color:var(--ink);font-weight:700}
.task{display:flex;align-items:center;gap:12px;padding:6px 0;border-bottom:1px dashed var(--line)}
.task:last-child{border-bottom:0}
.check{width:26px;height:26px;border-radius:50%;border:1.5px solid var(--pencil);flex:none;display:flex;align-items:center;justify-content:center;color:var(--leaf);font-weight:700}
.check.on{border:2.5px solid var(--leaf)}
.bori-say{display:flex;gap:10px;align-items:flex-end}
.bori-say svg{width:96px;flex:none}
.say{position:relative;padding:12px 14px;border:1.5px solid var(--line);border-radius:14px;background:var(--sheet);min-width:0}
.star{color:var(--sun)}
.stars{font-size:40px;letter-spacing:4px}
/* parent */
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:300px;margin:0 auto;width:100%}
.keypad button{height:60px;border-radius:12px;border:1.5px solid var(--line);background:var(--sheet);font-size:24px}
.pinbox{display:flex;gap:12px;justify-content:center;font-size:30px}
.pinbox span{width:20px;height:20px;border-radius:50%;border:2px solid var(--ink)}
.pinbox span.f{background:var(--ink)}
table{width:100%;border-collapse:collapse;font-size:15px}
td,th{padding:6px 4px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{color:var(--pencil);font-weight:400;font-size:13px}
.num{font-variant-numeric:tabular-nums;text-align:right}
.bars{display:flex;align-items:flex-end;gap:8px;height:110px;padding-top:8px}
.bar{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:4px;font-size:12px;color:var(--pencil);height:100%}
.bar i{display:block;width:100%;max-width:34px;background:var(--sky);border-radius:4px 4px 0 0;min-height:2px}
input,select,textarea{font:inherit;color:var(--ink);background:var(--sheet);border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;width:100%}
textarea{min-height:120px;font-family:var(--f-en)}
label{font-size:14px;color:var(--pencil);display:flex;flex-direction:column;gap:4px}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:16px;color:var(--ink)}
.toggle input{width:26px;height:26px;flex:none}
.note{font-size:14px;color:var(--pencil);background:var(--paper);border-radius:8px;padding:10px 12px}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>

<div id="app" aria-live="polite"></div>

const $ = s => document.querySelector(s);
function h(tag, attrs, ...kids){
  const el = document.createElement(tag);
  if (attrs) for (const k in attrs){
    const v = attrs[k];
    if (v == null || v === false) continue;
    if (k === "class") el.className = v;
    else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else if (k === "html") el.innerHTML = v;
    else el.setAttribute(k, v === true ? "" : v);
  }
  for (const kid of kids.flat()){
    if (kid == null || kid === false) continue;
    el.append(kid.nodeType ? kid : document.createTextNode(String(kid)));
  }
  return el;
}
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const pad = n => String(n).padStart(2, "0");
const dstr = d => d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());
const today = () => dstr(new Date());
const addDays = (s, n) => { const [y, m, d] = s.split("-").map(Number); return dstr(new Date(y, m - 1, d + n)); };
const fill = (s, me) => s.replace(/\{me\}/g, me);

let voice = null;
function pickVoice(){
  if (!("speechSynthesis" in window)) return;
  const vs = speechSynthesis.getVoices().filter(v => /^en[-_]US/i.test(v.lang));
  voice = vs.find(v => /Samantha|Allison|Ava|Google US English/i.test(v.name)) || vs[0] || null;
}
if ("speechSynthesis" in window){ pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }
function speak(text, slow){
  if (!("speechSynthesis" in window)) return;
  try{
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text.replace(/___/g, "blank"));
    u.lang = "en-US"; if (voice) u.voice = voice;
    u.rate = slow ? 0.7 : 0.88; u.pitch = 1.05;
    speechSynthesis.speak(u);
  }catch(e){}
}
let actx = null;
function sfx(kind){
  try{
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    const o = actx.createOscillator(), g = actx.createGain(), t = actx.currentTime;
    if (kind === "stamp"){ o.type = "sine"; o.frequency.setValueAtTime(150, t); o.frequency.exponentialRampToValueAtTime(70, t + .12); g.gain.setValueAtTime(.35, t); g.gain.exponentialRampToValueAtTime(.001, t + .16); }
    else { o.type = "triangle"; o.frequency.setValueAtTime(660, t); o.frequency.exponentialRampToValueAtTime(990, t + .06); g.gain.setValueAtTime(.18, t); g.gain.exponentialRampToValueAtTime(.001, t + .12); }
    o.connect(g).connect(actx.destination); o.start(t); o.stop(t + .2);
  }catch(e){}
}
function showStamp(ok){
  const s = h("div", {class:"stamp" + (ok ? "" : " again"), "aria-hidden":"true"}, ok ? "잘했어" : "다시 한 번");
  document.body.append(s); sfx("stamp");
  setTimeout(() => s.remove(), ok ? 650 : 900);
}

async function initSync(){
  if (!window.claude || !window.claude.use) return;
  try{

    if (!db || !user) return;

    dbRef = db.doc("data/users/" + id + "/english");

function customLesson(){
  if (!S.custom.length) return null;
  return {id:"T", title:"시험 대비 단어", theme:"📝", key:"학교 시험 단어", custom:true,
    words:S.custom.map(w => [w.en, w.ko, "", ""]), ext:[], pats:[], sents:[], dlg:[]};
}
const allLessons = () => { const c = customLesson(); return c ? LESSONS.concat([c]) : LESSONS; };
const lessonById = id => allLessons().find(l => l.id === id) || LESSONS[0];
function sentencesOf(L){
  return L.pats.map(p => ({t:p.t.replace("___", p.s[0]), ko:p.ko.replace("___", koSlot(L, p.s[0]))})).concat(L.sents);
}
function koSlot(L, en){ const w = L.words.find(w => en.toLowerCase().includes(w[0].toLowerCase())); return w ? w[1].split(",")[0] : en; }
const wordKey = (L, w) => "w:" + L.id + ":" + w[0];
const sentKey = (L, i) => "s:" + L.id + ":" + i;
function findItem(key){
  const [type, lid, rest] = [key.split(":")[0], key.split(":")[1], key.split(":").slice(2).join(":")];
  const L = lessonById(lid);
  if (type === "w"){ const w = L.words.find(w => w[0] === rest); return w ? {type, L, w} : null; }
  const s = sentencesOf(L)[Number(rest)]; return s ? {type, L, s} : null;
}
function addItem(key, box, due){ if (!S.boxes[key]) S.boxes[key] = {b:box, due, wrong:0}; }
function introduceLesson(L){
  const t1 = addDays(today(), 1);
  L.words.forEach(w => addItem(wordKey(L, w), 1, t1));
  sentencesOf(L).forEach((s, i) => addItem(sentKey(L, i), 1, t1));
}
function markLearn(key, ok){
  const it = S.boxes[key]; if (!it) return;
  if (!ok){ it.b = 1; it.due = addDays(today(), 1); it.wrong = (it.wrong || 0) + 1; it.lastWrong = today(); }
}
function markReview(key, ok){
  const it = S.boxes[key]; if (!it) return;
  if (ok){ it.b = Math.min(6, it.b + 1); it.due = it.b >= 6 ? "9999-12-31" : addDays(today(), INTERVAL[it.b]); }
  else { it.b = 1; it.due = addDays(today(), 1); it.wrong = (it.wrong || 0) + 1; it.lastWrong = today(); }
}
const dueKeys = () => Object.keys(S.boxes).filter(k => S.boxes[k].b <= 5 && S.boxes[k].due <= today() && findItem(k)).sort((a, b) => S.boxes[a].due < S.boxes[b].due ? -1 : 1);
function seedPrevious(){
  if (S.seeded) return;
  const cur = LESSONS.findIndex(l => l.id === S.lesson);
  let i = 0;
  LESSONS.slice(0, Math.max(0, cur)).forEach(L => {
    L.words.forEach(w => { addItem(wordKey(L, w), 2, addDays(today(), 1 + Math.floor(i / 12))); i++; });
    sentencesOf(L).forEach((s, j) => { addItem(sentKey(L, j), 2, addDays(today(), 1 + Math.floor(i / 12))); i++; });
  });
  S.seeded = true; save();
}

/* ───────── 오늘 기록 ───────── */
function dayRec(){ const t = today(); S.days[t] = S.days[t] || {min:0, stars:0, done:[]}; return S.days[t]; }
function weekDates(){
  const now = new Date(); const dow = (now.getDay() + 6) % 7; // 월=0
  return [0,1,2,3,4].map(i => dstr(new Date(now.getFullYear(), now.getMonth(), now.getDate() - dow + i)));
}
function todayPlan(){
  const plan = [];
  const due = dueKeys();
  if (due.length) plan.push({kind:"review", label:"오늘의 복습", sub:Math.min(15, due.length) + "개", id:"review"});
  const L = lessonById(S.lesson);
  const acts = L.custom ? TEST_ACTS : ACTS.map(a => a.id);
  const left = acts.filter(a => !(S.done[L.id] && S.done[L.id][a]));
  left.slice(0, 2).forEach(a => plan.push({kind:"act", lesson:L.id, act:a, label:ACTS.find(x => x.id === a).name, sub:L.id === "T" ? "시험 대비" : L.id, id:L.id + ":" + a}));
  if (!left.length){
    const idx = LESSONS.findIndex(l => l.id === L.id), next = LESSONS[idx + 1];
    if (next) plan.push({kind:"act", lesson:next.id, act:"cards", label:"다음 단원 단어 카드", sub:next.id, id:next.id + ":cards"});
  }
  return plan;
}

  seedPrevious();
  const plan = todayPlan(), rec = S.days[today()] || {done:[]};

let planQueue = [], planReturn = "home", actStart = 0;
function runPlan(items, ret){ planQueue = items.slice(); planReturn = ret || "home"; nextInPlan(); }
function nextInPlan(){
  const item = planQueue.shift();
  if (!item) return route(planReturn);
  actStart = Date.now();
  if (item.kind === "review") return actReview(res => finishItem(item, res));
  const L = lessonById(item.lesson);
  const fn = {cards:actCards, match:actMatch, spell:actSpell, pattern:actPattern, order:actOrder, listen:actListen, role:actRole, chat:actChat, test:actTest}[item.act];
  fn(L, res => finishItem(item, res));
}
function starsFor(res){ if (!res.total) return res.stars || 1; const r = res.correct / res.total; return r >= .9 ? 3 : r >= .7 ? 2 : 1; }
function finishItem(item, res){
  const rec = dayRec();
  rec.min += Math.min(15, Math.max(1, Math.round((Date.now() - actStart) / 60000)));
  const st = starsFor(res); rec.stars += st; S.stars += st;
  if (!rec.done.includes(item.id)) rec.done.push(item.id);
  if (item.kind === "act"){
    S.done[item.lesson] = S.done[item.lesson] || {};
    if (item.act === "test"){
      const score = Math.round(res.correct / res.total * 100);
      S.done[item.lesson].test = Math.max(score, S.done[item.lesson].test || 0);
      S.tests.unshift({lesson:item.lesson, date:today(), score, wrong:res.wrongWords || []}); S.tests = S.tests.slice(0, 40);
    } else S.done[item.lesson][item.act] = true;
    if (item.act === "cards" && item.lesson !== S.lesson && !lessonById(item.lesson).custom){
      const ci = LESSONS.findIndex(l => l.id === S.lesson), ni = LESSONS.findIndex(l => l.id === item.lesson);
      if (ni > ci) S.lesson = item.lesson;
    }
  }
  save();
  app.innerHTML = "";
  sfx("pop");
  const praise = res.fixed && res.fixed.length ? "어제 틀린 " + res.fixed[0] + ", 오늘은 맞혔어." :
    res.total ? (res.correct === res.total ? "하나도 안 틀렸어." : res.total - res.correct + "개는 복습 상자에 넣어 둘게.") : "잘 따라왔어.";
  app.append(
    h("div", {class:"bori-say"}, boriSVG(), h("div", {class:"say"}, praise)),

function choiceQuestion(body, q, onDone){

    else { check.remove(); body.append(h("div", {class:"sheet en", style:"background:var(--peach);font-size:22px;text-align:center"}, s.t), h("button", {class:"btn primary block", onclick:() => onDone(false)}, "다음")); }
  });
  body.append(
    h("div", {class:"sheet col", style:"align-items:center;text-align:center"}, h("p", {style:"font-size:21px"}, s.ko), h("button", {class:"btn sound", onclick:() => speak(s.t)}, "🔈 듣기")),
    built, h("p", {class:"small muted"}, "단어를 눌러 순서대로 놓아 봐. 놓은 단어를 누르면 빠져."), pool,
    check);
  paint();
}
function actOrder(L, done){
  const list = sentencesOf(L).map((s, i) => ({s, i})).filter(x => x.s.t.split(" ").length > 1);
  if (!list.length) return done({title:"문장이 없어요", stars:1});
  let i = 0, correct = 0;
  const f = frame("순서 퍼즐", list.length);
  function next(){
    f.setProgress(i);
    if (i >= list.length) return done({title:"순서 퍼즐 끝", correct, total:list.length});
    orderQuestion(f.body, list[i].s, ok => { if (ok) correct++; markLearn(sentKey(L, list[i].i), ok); i++; next(); });
  }
  next();
}

/* 6·7. 대화 듣기 / 역할 놀이 */
function dialogueRunner(L, mode, done){
  const me = S.name || "Elly";
  const lines = L.dlg.map(d => [d[0], fill(d[1], me), fill(d[2], me)]);
  const f = frame(mode === "role" ? "역할 놀이" : "대화 듣기", lines.length);
  const log = h("div", {class:"col", style:"gap:10px"});
  const ctrl = h("div", {class:"col"});
  f.body.append(h("div", {class:"scene", "aria-hidden":"true"}, L.theme), log, ctrl);
  let i = 0;
  function bubble(d, now){
    return h("div", {class:"bubble" + (d[0] === "M" ? " me" : "") + (now ? " now" : "")},
      h("div", {class:"who"}, d[0] === "M" ? me + " (나)" : "보리"),
      h("button", {class:"en", style:"text-align:left", onclick:() => speak(d[1])}, d[1]), h("div", {class:"small muted"}, d[2]));
  }
  function step(){
    f.setProgress(i); ctrl.innerHTML = "";
    if (i >= lines.length){
      ctrl.append(h("button", {class:"btn sound block", onclick:() => { log.innerHTML = ""; i = 0; step(); }}, "처음부터 다시"),
        h("button", {class:"btn primary block", onclick:() => done({title:mode === "role" ? "역할 놀이 끝" : "대화 듣기 끝", stars:mode === "role" ? 2 : 1})}, "끝내기"));
      return;
    }
    const d = lines[i];
    [...log.children].forEach(c => c.classList.remove("now"));
    if (mode === "role" && d[0] === "M"){
      log.append(bubble(d, true));
      ctrl.append(h("p", {class:"small muted"}, "네 차례야. 소리 내어 말해 봐."),
        h("div", {class:"grid2"}, h("button", {class:"btn sound", onclick:() => speak(d[1], true)}, "🔈 힌트 듣기"),
          h("button", {class:"btn primary", onclick:() => { i++; step(); }}, "말했어")));
    } else {
      log.append(bubble(d, true)); speak(d[1]);
      ctrl.append(h("button", {class:"btn primary block", onclick:() => { i++; step(); }}, "다음"));
    }
    log.lastChild.scrollIntoView({block:"nearest", behavior:"smooth"});
  }
  step();
}
const actListen = (L, done) => dialogueRunner(L, "listen", done);
const actRole = (L, done) => dialogueRunner(L, "role", done);

/* 8. 보리랑 이야기 */
async function actChat(L, done){
  const me = S.name || "Elly";
  const f = frame("보리랑 이야기", 5);
  const log = h("div", {class:"col", style:"gap:10px"});
  const ctrl = h("div", {class:"col"});
  f.body.append(h("div", {class:"bori-say"}, boriSVG(), h("div", {class:"say small"}, "보리 말에 맞는 대답을 골라서 소리 내어 말해 봐.")), log, ctrl);
  let sample = null;
  if (S.settings.ai && window.claude && window.claude.use){ try{ sample = await claude.use("sample"); }catch(e){} }
  const history = [];
  let turn = 0, picks = 0;
  const vocab = L.words.map(w => w[0]).join(", ");
  const pats = L.pats.map(p => p.t).concat(L.sents.map(s => s.t)).join(" | ");
  // 대본 대화 (AI를 쓸 수 없을 때)
  const script = [];
  for (let k = 0; k < L.dlg.length; k++){ if (L.dlg[k][0] === "B" && L.dlg[k + 1] && L.dlg[k + 1][0] === "M") script.push({bori:fill(L.dlg[k][1], me), ko:fill(L.dlg[k][2], me), answer:fill(L.dlg[k + 1][1], me)}); }
  const meLines = LESSONS.flatMap(x => x.dlg.filter(d => d[0] === "M").map(d => fill(d[1], me)));
  function addBubble(who, en, ko){
    log.append(h("div", {class:"bubble" + (who === "M" ? " me" : "")}, h("div", {class:"who"}, who === "M" ? me + " (나)" : "보리"),
      h("button", {class:"en", style:"text-align:left", onclick:() => speak(en)}, en), ko ? h("div", {class:"small muted"}, ko) : null));
    log.lastChild.scrollIntoView({block:"nearest", behavior:"smooth"});
  }
  function offer(choices, last){
    ctrl.innerHTML = "";
    ctrl.append(h("p", {class:"small muted"}, "대답을 골라 봐"),
      ...choices.map(c => h("button", {class:"tile en", style:"font-size:20px", onclick:() => {
        speak(c); addBubble("M", c); history.push({role:"me", text:c}); picks++;
        ctrl.innerHTML = ""; turn++; f.setProgress(turn);
        if (last || turn >= 5) return setTimeout(endChat, 900);
        setTimeout(nextTurn, 900);
      }}, c)));
  }
  function endChat(){
    ctrl.innerHTML = "";
    ctrl.append(h("button", {class:"btn primary block", onclick:() => done({title:"보리랑 이야기 끝", stars:2})}, "끝내기"));
  }
  function scripted(){
    const s = script[turn];
    if (!s) return endChat();
    addBubble("B", s.bori, s.ko); speak(s.bori);
    const wrong = shuffle(meLines.filter(x => x !== s.answer)).slice(0, 2);
    offer(shuffle([s.answer].concat(wrong)), turn >= script.length - 1);
  }
  async function nextTurn(){
    if (!sample) return scripted();
    ctrl.innerHTML = ""; ctrl.append(h("p", {class:"small muted"}, "보리가 생각하는 중…"));
    const last = turn >= 4;
    const prompt =
`You are Bori, a small hedgehog who is a pen pal of ${me}, a Korean girl in 3rd grade learning English.
Today's textbook lesson: "${L.title}". Allowed words: ${vocab}, plus very common words (I, you, my, is, are, a, the, yes, no, hello, wow, me, too, it).
Lesson patterns: ${pats}
Rules: speak in ONE short sentence or question, at most 8 words, using only the lesson words and patterns. Warm and plain. No emoji. Never mention AI, computers or being a program. Sometimes ask a question she can answer with a lesson pattern.
Conversation so far:
${history.map(m => (m.role === "bori" ? "Bori: " : me + ": ") + m.text).join("\n") || "(start: greet her and begin the topic)"}
${last ? "This is the last turn: say a friendly goodbye." : ""}
Reply ONLY with JSON: {"bori": "<your line>", "ko": "<natural Korean translation for a child>", "choices": ["<reply 1>", "<reply 2>", "<reply 3>"]}
The 3 choices are short English replies (max 7 words) ${me} could say next, each a correct, natural answer built from the lesson patterns, different from each other.${last ? ' Make the choices goodbyes like "Goodbye, Bori!".' : ""}`;
    try{
      const r = await sample.json(prompt, {modelTier:"quick", cache:false});
      if (!r || typeof r.bori !== "string" || !Array.isArray(r.choices) || r.choices.length < 2) throw new Error("shape");
      history.push({role:"bori", text:r.bori});
      ctrl.innerHTML = "";
      addBubble("B", r.bori, r.ko || ""); speak(r.bori);
      offer(r.choices.slice(0, 3).map(String), last);
    }catch(e){ sample = null; turn = 0; log.innerHTML = ""; history.length = 0; scripted(); }
  }
  nextTurn();
}

/* 9. 단원 테스트 */
function actTest(L, done){
  const qs = [];
  const ws = shuffle(L.words).slice(0, 8);
  ws.forEach((w, k) => qs.push({kind:"w", w, q:k % 2 ? meaningToEnglish(L, w) : hearToMeaning(L, w)}));
  const sents = sentencesOf(L);
  const others = LESSONS.filter(x => x.id !== L.id).flatMap(sentencesOf);
  shuffle(sents).slice(0, 4).forEach(s => {
    const opts = shuffle([s].concat(shuffle(others.filter(o => o.t !== s.t)).slice(0, 2)));
    qs.push({kind:"s", q:{head:h("div", {class:"sheet col", style:"text-align:center"}, h("p", {class:"small muted"}, "알맞은 문장을 골라 봐"), h("p", {style:"font-size:22px"}, s.ko)),
      sayAfter:s.t, options:opts.map(o => ({label:o.t, en:true, correct:o === s}))}});
  });
  const me = S.name || "Elly";
  const pairs = [];
  for (let k = 0; k < L.dlg.length - 1; k++) if (L.dlg[k][0] !== L.dlg[k + 1][0]) pairs.push([fill(L.dlg[k][1], me), fill(L.dlg[k + 1][1], me), fill(L.dlg[k][2], me)]);
  const otherReplies = LESSONS.filter(x => x.id !== L.id).flatMap(x => x.dlg.map(d => fill(d[1], me)));
  shuffle(pairs).slice(0, 2).forEach(p => {
    const opts = shuffle([p[1]].concat(shuffle(otherReplies.filter(o => o !== p[1])).slice(0, 2)));
    qs.push({kind:"d", q:{head:h("div", {class:"sheet col"}, h("p", {class:"small muted"}, "보리가 이렇게 말했어. 뭐라고 대답할까?"),
      h("div", {class:"bubble"}, h("button", {class:"en", onclick:() => speak(p[0])}, p[0]), h("div", {class:"small muted"}, p[2]))),
      say:p[0], options:opts.map(o => ({label:o, en:true, correct:o === p[1]}))}});
  });
  let i = 0, correct = 0; const wrongWords = [];
  const f = frame("단원 테스트", qs.length);
  function next(){
    f.setProgress(i);
    if (i >= qs.length){
      const score = Math.round(correct / qs.length * 100);
      return done({title:score >= 80 ? L.id + " 통과!" : "조금만 더 연습하자", correct, total:qs.length, wrongWords});
    }
    const item = qs[i];
    choiceQuestion(f.body, item.q, ok => {
      if (ok) correct++;
      else if (item.kind === "w"){ wrongWords.push(item.w[0]); markLearn(wordKey(L, item.w), false); }
      i++; next();
    });
  }
  next();
}

/* 복습 */
function actReview(done){
  const keys = dueKeys().slice(0, 15);
  let i = 0, correct = 0; const fixed = [];
  const f = frame("오늘의 복습", keys.length);
  function next(){
    f.setProgress(i);
    if (i >= keys.length) return done({title:"복습 끝", correct, total:keys.length, fixed});
    const key = keys[i], it = findItem(key), box = S.boxes[key];
    const after = ok => {
      if (ok){ correct++; if (box.lastWrong && box.lastWrong < today() && it.type === "w") fixed.push(it.w[0]); }
      markReview(key, ok); save(); i++; next();
    };
    if (it.type === "s") return orderQuestion(f.body, it.s, after);
    if (box.b >= 3 && spellable(it.w)) return spellQuestion(f.body, it.w, after);
    choiceQuestion(f.body, box.b >= 2 ? meaningToEnglish(it.L, it.w) : hearToMeaning(it.L, it.w), after);
  }
  next();
}

function pinPad(){
  const setting = !S.settings.pin;
  let entry = "", first = "";
  const dots = h("div", {class:"pinbox", "aria-label":"PIN"});
  const msg = h("p", {class:"small muted", style:"text-align:center;min-height:1.5em"}, setting ? "부모님이 쓸 숫자 4자리를 정해 주세요" : "부모님 PIN 4자리");
  function paint(){ dots.innerHTML = ""; for (let k = 0; k < 4; k++) dots.append(h("span", {class:k < entry.length ? "f" : ""})); }
  function press(d){
    if (d === "←"){ entry = entry.slice(0, -1); return paint(); }
    if (entry.length >= 4) return;
    entry += d; paint();
    if (entry.length < 4) return;
    setTimeout(() => {
      if (setting && !first){ first = entry; entry = ""; msg.textContent = "한 번 더 눌러 주세요"; return paint(); }
      if (setting){ if (entry === first){ S.settings.pin = entry; save(); parentOk = true; route("parent"); } else { first = ""; entry = ""; msg.textContent = "두 번이 달라요. 처음부터 다시 정해 주세요"; paint(); } return; }
      if (entry === S.settings.pin){ parentOk = true; route("parent"); } else { entry = ""; msg.textContent = "PIN이 달라요"; paint(); }
    }, 120);
  }
  app.append(
    h("div", {class:"topbar"}, h("button", {class:"close", "aria-label":"홈으로", onclick:() => route("home")}, "‹"), h("h2", null, "부모님 화면")),

  paint();
}
